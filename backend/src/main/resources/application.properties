spring.application.name=bdregistros

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bdregistros}
spring.datasource.username=${DB_USER:bdregistros}
spring.datasource.password=${DB_PASSWORD:changeit}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT_SECRET (obrigatorio, 32+ caracteres) e FRONTEND_ORIGIN sao lidos
# diretamente das variaveis de ambiente pelo SecurityConfig/JwtService.
