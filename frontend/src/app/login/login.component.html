<div class="login-pagina">
  <form class="login glass-card" [formGroup]="form" (ngSubmit)="entrar()">
    <h1>Entrar</h1>

    <label class="field-pill">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" />
        </svg>
      </span>
      <input formControlName="login" type="text" autocomplete="username" placeholder="Login" />
    </label>

    <label class="field-pill">
      <span class="icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V7a4 4 0 1 1 8 0v4" />
        </svg>
      </span>
      <input formControlName="senha" type="password" autocomplete="current-password" placeholder="Senha" />
    </label>

    <button type="submit" [disabled]="enviando">
      {{ enviando ? 'Entrando...' : 'Entrar' }}
    </button>

    <p class="mensagem-erro" *ngIf="erro">{{ erro }}</p>
  </form>
</div>
